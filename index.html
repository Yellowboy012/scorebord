<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scorebord">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Scorebord</title>
<style>
  /* ---------- Base ---------- */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#111;
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

  /* ---------- Scoreboard layout ----------
     Grid rows of minmax(0,1fr) are always exactly equal, whatever is inside,
     so the seam (and the timer on it) sits in the true middle. */
  #app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);container-type:size}
  .team{position:relative;overflow:hidden;touch-action:none;transition:background-color .3s,color .3s}
  .team:nth-of-type(1){padding:calc(16px + env(safe-area-inset-top)) 16px 46px}
  .team:nth-of-type(2){padding:46px 16px calc(96px + env(safe-area-inset-bottom))}
  .inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqh;transition:transform .35s}
  .team.flipped .inner{transform:rotate(180deg)}
  .name{font-size:clamp(24px,7.5cqw,40px);font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;opacity:.9}
  .score{font-size:min(50cqw,19cqh);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .team[data-digits="3"] .score{font-size:min(33cqw,19cqh)}
  .score.pop{animation:pop .18s ease-out}
  @keyframes pop{50%{transform:scale(1.07)}}

  /* Floating +1 / −1 at the finger */
  .delta{position:absolute;transform:translate(-50%,-50%);font-size:46px;font-weight:800;pointer-events:none;animation:float .7s ease-out forwards}
  @keyframes float{to{transform:translate(-50%,-160%);opacity:0}}
  .team.flipped .delta{animation-name:floatFlip}
  @keyframes floatFlip{from{transform:translate(-50%,-50%) rotate(180deg)}to{transform:translate(-50%,60%) rotate(180deg);opacity:0}}

  /* ---------- Timer pill on the seam ---------- */
  #timer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
    display:flex;align-items:stretch;border-radius:999px;overflow:hidden;
    background:rgba(18,18,20,.9);color:#fff;font-size:26px;font-weight:700;
    font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:background .25s}
  #timer button{display:flex;align-items:center;gap:10px;color:#fff;font-size:inherit;font-weight:inherit;padding:11px 0;min-height:54px}
  #timer button:active{background:rgba(255,255,255,.15)}
  #timerToggle{padding-left:20px!important;padding-right:18px!important}
  #timerReset{padding-left:16px!important;padding-right:18px!important;border-left:1px solid rgba(255,255,255,.22)}
  #timer svg{width:22px;height:22px;fill:currentColor}
  #timer #timerReset svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #timer.warn{background:#c2410c}
  #timer.done{background:#d92d20;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}

  /* ---------- Bottom buttons ---------- */
  .fab{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));height:60px;border-radius:30px;
    background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:8px;z-index:5;
    box-shadow:0 0 0 1px rgba(0,0,0,.1),0 4px 14px rgba(0,0,0,.2);transition:transform .1s}
  .fab:active{transform:scale(.95)}
  .fab svg{width:26px;height:26px;stroke:#000;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
  #btnAdd{left:20px;padding:0 22px 0 18px;font-size:18px;font-weight:700}
  #btnMenu{right:20px;width:60px}

  /* ---------- Landscape: teams side by side, timer between the buttons ---------- */
  @media (orientation:landscape){
    #app{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .team:nth-of-type(1),.team:nth-of-type(2){padding:calc(14px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom))}
    .name{font-size:clamp(20px,3.6cqw,34px)}
    .score{font-size:min(24cqw,42cqh)}
    .team[data-digits="3"] .score{font-size:min(16cqw,42cqh)}
    #timer{top:auto;bottom:calc(23px + env(safe-area-inset-bottom));transform:translateX(-50%)}
  }

  /* ---------- Bottom sheet ---------- */
  #sheet{position:fixed;inset:0;z-index:20;display:none}
  #sheet.open{display:block}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s}
  .panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
    background:#1c1c1e;color:#fff;border-radius:26px 26px 0 0;padding:0 20px calc(24px + env(safe-area-inset-bottom));
    animation:up .25s ease-out;touch-action:pan-y}
  .panel input{-webkit-user-select:text;user-select:text}
  /* Drag zone at the top of the sheet: swipe down to close */
  .grab{height:30px;display:grid;place-items:center;touch-action:none;margin:0 -20px 4px}
  .grab::before{content:"";width:40px;height:5px;border-radius:3px;background:#555}
  .x{position:absolute;top:18px;right:16px;width:36px;height:36px;border-radius:50%;background:#2c2c2e;color:#c8c8cc;font-size:22px;line-height:1;display:grid;place-items:center}
  @keyframes up{from{transform:translateY(100%)}}
  @keyframes fade{from{opacity:0}}
  h2{margin:0 48px 18px 0;font-size:24px}
  .field{display:block;margin-bottom:18px}
  .field>span{display:block;font-size:14px;color:#9a9aa0;margin-bottom:8px}
  input[type=text],input[type=number]{width:100%;font:inherit;font-size:20px;color:#fff;background:#2c2c2e;border:2px solid transparent;
    border-radius:14px;padding:12px 14px;outline:none}
  input:focus{border-color:#0a84ff}
  .input-wrap{position:relative}
  .input-wrap input{padding-right:52px}
  .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#48484a;font-size:20px;line-height:1}
  .stepper{display:flex;gap:10px}
  .stepper button{width:60px;flex:none;border-radius:14px;background:#2c2c2e;font-size:28px;font-weight:700}
  .stepper button:active{background:#3a3a3c}
  .stepper input{text-align:center;font-weight:700}
  .swatches{display:flex;flex-wrap:wrap;gap:12px}
  .sw{width:46px;height:46px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .sw.sel{border-color:#1c1c1e;outline:3px solid #fff}
  .sw.custom{position:relative;background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);overflow:hidden}
  .sw.custom input{position:absolute;inset:-10px;width:70px;height:70px;opacity:0;cursor:pointer}
  .primary,.secondary,.danger{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-size:18px;font-weight:700;margin-top:10px}
  .primary{background:#0a84ff;color:#fff}
  .secondary{background:#2c2c2e}
  .danger{background:#2c2c2e;color:#ff6961}
  .danger.armed{background:#d92d20;color:#fff}
  .primary:active,.secondary:active,.danger:active{filter:brightness(1.2)}
  .primary:disabled{opacity:.4}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2>button{margin-top:10px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:14px 0;border-radius:14px;background:#2c2c2e;font-size:18px;font-weight:700}
  .seg button.on{background:#0a84ff}

  /* Toggle switches in the menu */
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#2c2c2e;border-radius:16px;padding:14px 16px;margin-top:10px;font-size:17px;font-weight:600}
  .switch-row small{display:block;font-size:13px;color:#9a9aa0;font-weight:400;margin-top:2px}
  .switch-row input{display:none}
  .switch-row i{width:51px;height:31px;border-radius:16px;background:#48484a;position:relative;flex:none;transition:.2s}
  .switch-row i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
  .switch-row input:checked+i{background:#34c759}
  .switch-row input:checked+i::after{transform:translateX(20px)}

  /* Finish-game summary */
  .final{display:flex;gap:12px;margin:4px 0 12px;font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
  .final .box{flex:1;text-align:center;padding:16px 6px 12px;border-radius:18px;min-width:0;line-height:1.05}
  .final small{display:block;font-size:15px;font-weight:600;opacity:.85;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .verdict{text-align:center;font-size:20px;font-weight:700;margin-bottom:6px}

  /* History */
  .stand{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
  .stand .row{display:flex;align-items:center;gap:12px;background:#2c2c2e;border-radius:14px;padding:12px 14px}
  .dot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .stand .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stand .nm small{display:block;font-size:13px;font-weight:400;color:#9a9aa0}
  .stand .wins{font-size:26px;font-weight:800;text-align:right;line-height:1}
  .stand .wins small{display:block;font-size:12px;font-weight:500;color:#9a9aa0;margin-top:2px}
  .sub{font-size:14px;color:#9a9aa0;margin:0 0 6px}
  table{width:100%;border-collapse:collapse;font-size:16px;table-layout:fixed}
  td{padding:11px 4px;border-top:1px solid #333;vertical-align:middle}
  td.nr{color:#9a9aa0;width:52px;font-size:14px;line-height:1.2}
  td.nr small{display:block;font-size:12px}
  td.sc{text-align:center;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;width:80px}
  td.l{text-align:right}
  td.l,td.r{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c8c8cc}
  td.w{font-weight:800;color:#fff}
  .empty{text-align:center;color:#9a9aa0;padding:28px 0;line-height:1.6}
  .help{color:#c8c8cc;line-height:1.5;font-size:17px;display:grid;gap:12px}
  .help div{display:flex;gap:12px;align-items:flex-start}
  .help span{font-size:22px;width:30px;flex:none;text-align:center}
  .help b{color:#fff}

  /* ---------- Toast (with optional undo button) ---------- */
  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    display:flex;align-items:center;gap:14px;background:rgba(20,20,22,.95);color:#fff;padding:12px 16px 12px 18px;border-radius:16px;
    font-size:15px;line-height:1.4;text-align:center;max-width:90vw;width:max-content;opacity:0;pointer-events:none;transition:.25s;z-index:30;
    box-shadow:0 6px 20px rgba(0,0,0,.3)}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #toast.show.act{pointer-events:auto}
  #toast button{color:#4da3ff;font-weight:700;padding:4px 2px;white-space:nowrap}
</style>
</head>
<body>

<div id="app">
  <section class="team"><div class="inner"><div class="name"></div><div class="score"></div></div></section>
  <section class="team"><div class="inner"><div class="name"></div><div class="score"></div></div></section>

  <div id="timer">
    <button id="timerToggle" aria-label="Timer starten of pauzeren"></button>
    <button id="timerReset" aria-label="Timer opnieuw">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4.5v4.5h4.5"/></svg>
    </button>
  </div>

  <button class="fab" id="btnAdd" aria-label="Potje afronden en opslaan">
    <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    <span>Potje afronden</span>
  </button>
  <button class="fab" id="btnMenu" aria-label="Menu">
    <svg viewBox="0 0 24 24" style="fill:#000;stroke:none"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
  </button>
</div>

<div id="sheet">
  <div class="backdrop" id="backdrop"></div>
  <div class="panel" id="panel">
    <div class="grab" id="grab"></div>
    <button class="x" id="sheetClose" aria-label="Sluiten">×</button>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   State
   ============================================================ */
const KEY = 'scorebord.v1';
const COLORS = ['#FCFC54','#EE9536','#E5484D','#F472B6','#8B5CF6','#3B82F6','#22D3EE','#4ADE80','#FFFFFF','#111111'];

const defaults = () => ({
  teams: [
    { name: 'Team 1', color: '#FCFC54', score: 0 },
    { name: 'Team 2', color: '#EE9536', score: 0 }
  ],
  timerMin: 8,
  timer: { running: false, remainingMs: 8 * 60000, endAt: 0 },
  history: [],
  flipTop: false,
  sound: true,
  hintSeen: false
});

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.teams) && s.teams.length === 2) return { ...defaults(), ...s };
  } catch (e) {}
  return defaults();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let state = load();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teamEls = [...document.querySelectorAll('.team')];
const label = (t, i) => (t.name && t.name.trim()) || `Team ${i + 1}`;
const portrait = matchMedia('(orientation: portrait)');
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* Black or white text depending on how bright the background is */
function textOn(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 >= 170 ? '#000' : '#fff';
}

/* ============================================================
   Rendering
   ============================================================ */
function render() {
  state.teams.forEach((t, i) => {
    const el = teamEls[i];
    el.style.background = t.color;
    el.style.color = textOn(t.color);
    el.querySelector('.name').textContent = label(t, i);
    el.querySelector('.score').textContent = t.score;
    el.dataset.digits = Math.min(3, String(t.score).length);
  });
  // Flipping the top team only makes sense when the halves are stacked
  teamEls[0].classList.toggle('flipped', state.flipTop && portrait.matches);
  renderTimer();
}
portrait.addEventListener('change', render);

function popScore(i) {
  const s = teamEls[i].querySelector('.score');
  s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
}

function showDelta(i, d, x, y) {
  const el = teamEls[i], r = el.getBoundingClientRect();
  const f = document.createElement('span');
  f.className = 'delta';
  f.textContent = d > 0 ? '+1' : '−1';
  f.style.left = (x - r.left) + 'px';
  f.style.top = (y - r.top) + 'px';
  el.appendChild(f);
  f.addEventListener('animationend', () => f.remove());
}

function change(i, d, x, y) {
  const t = state.teams[i];
  const next = Math.min(999, Math.max(0, t.score + d));
  if (next === t.score) return;
  t.score = next;
  save(); render(); popScore(i);
  if (x !== undefined) showDelta(i, d, x, y);
  buzz(8);
}

/* ============================================================
   Gestures: tap = +1, drag down = −1, long press = edit
   ============================================================ */
function bindTeam(el, i) {
  let sx = 0, sy = 0, active = false, handled = false, moved = false, lp = null;

  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    unlockAudio();
    active = true; handled = false; moved = false;
    sx = e.clientX; sy = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    lp = setTimeout(() => {
      if (active && !moved && !handled) { handled = true; buzz(20); openEdit(i); }
    }, 500);
  });

  el.addEventListener('pointermove', e => {
    if (!active || handled) return;
    const dx = e.clientX - sx;
    // A flipped team is read upside down, so "down" for that player is up on screen
    const dy = (e.clientY - sy) * (el.classList.contains('flipped') ? -1 : 1);
    if (Math.hypot(dx, dy) > 10) { moved = true; clearTimeout(lp); }
    if (dy > 40 && dy > Math.abs(dx)) { handled = true; change(i, -1, e.clientX, e.clientY); }
  });

  el.addEventListener('pointerup', e => {
    clearTimeout(lp);
    if (active && !handled && !moved) change(i, +1, e.clientX, e.clientY);
    active = false;
  });
  el.addEventListener('pointercancel', () => { clearTimeout(lp); active = false; });
  el.addEventListener('contextmenu', e => e.preventDefault());
}
teamEls.forEach(bindTeam);

/* ============================================================
   Timer
   ============================================================ */
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

const msLeft = () => state.timer.running ? Math.max(0, state.timer.endAt - Date.now()) : state.timer.remainingMs;

let lastRendered = '';
function renderTimer() {
  const ms = msLeft();
  const secs = Math.ceil(ms / 1000);
  const text = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
  const key = text + state.timer.running;
  // Only touch the DOM when something visible changed (runs 4x per second)
  if (key !== lastRendered) {
    $('#timerToggle').innerHTML = `${state.timer.running ? ICON_PAUSE : ICON_PLAY}<span>${text}</span>`;
    lastRendered = key;
  }
  $('#timer').classList.toggle('warn', state.timer.running && secs <= 10);
  $('#timer').classList.toggle('done', ms <= 0 && !state.timer.running);
}

function startTimer() {
  unlockAudio();
  if (msLeft() <= 0) state.timer.remainingMs = state.timerMin * 60000;
  state.timer.endAt = Date.now() + state.timer.remainingMs;
  state.timer.running = true;
  keepAwake(); save(); renderTimer();
}
function pauseTimer() {
  state.timer.remainingMs = msLeft();
  state.timer.running = false;
  releaseAwake(); save(); renderTimer();
}
function resetTimer() {
  state.timer = { running: false, remainingMs: state.timerMin * 60000, endAt: 0 };
  releaseAwake(); save(); renderTimer();
}

$('#timerToggle').addEventListener('click', () => {
  if (state.timer.running) pauseTimer();
  else if (msLeft() <= 0) resetTimer();   // tap on 00:00 = back to full time
  else startTimer();
});
$('#timerReset').addEventListener('click', () => { resetTimer(); buzz(10); toast(`Timer terug naar ${state.timerMin} min`, 1600); });

let lastBeep = 0;
function tick() {
  if (state.timer.running) {
    const ms = msLeft();
    const secs = Math.ceil(ms / 1000);
    // Short countdown beeps at 3, 2, 1
    if (secs <= 3 && secs > 0 && secs !== lastBeep) { lastBeep = secs; if (state.sound) beep(0, .09, 660); }
    if (ms <= 0) {
      state.timer.running = false;
      state.timer.remainingMs = 0;
      lastBeep = 0;
      releaseAwake(); save();
      timeUp();
    }
  }
  renderTimer();
}
setInterval(tick, 250);

/* Sound: browsers only allow audio after a user touch, so unlock on first touch */
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function beep(at, dur, freq = 880) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + at); o.stop(audioCtx.currentTime + at + dur);
  } catch (e) {}
}
function alarm() {
  if (state.sound) { beep(0, .25); beep(.4, .25); beep(.8, .7); }
  buzz([300, 150, 300, 150, 600]);
}

/* Keep the screen on while the timer runs */
let wake = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wake) {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    }
  } catch (e) {}
}
function releaseAwake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { if (state.timer.running) keepAwake(); tick(); }
});

/* ============================================================
   Bottom sheet
   ============================================================ */
function openSheet(html, after) {
  $('#sheetBody').innerHTML = html;
  $('#panel').scrollTop = 0;
  $('#sheet').classList.add('open');
  if (after) after($('#sheetBody'));
}
function closeSheet() {
  if (document.activeElement) document.activeElement.blur();
  $('#sheet').classList.remove('open');
  $('#panel').style.transform = '';
  state.teams.forEach((t, i) => { if (!t.name.trim()) t.name = `Team ${i + 1}`; });
  save(); render();
}
$('#backdrop').addEventListener('click', closeSheet);
$('#sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* Swipe the sheet down by its top bar to close it */
(() => {
  const grab = $('#grab'), panel = $('#panel');
  let y0 = null;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; grab.setPointerCapture(e.pointerId); panel.style.transition = 'none'; });
  grab.addEventListener('pointermove', e => {
    if (y0 === null) return;
    panel.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`;
  });
  const end = e => {
    if (y0 === null) return;
    const dy = e.clientY - y0; y0 = null;
    panel.style.transition = 'transform .2s';
    if (dy > 90) closeSheet(); else panel.style.transform = '';
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
})();

/* ---------- Toast, optionally with an undo button ---------- */
let toastTimer;
function toast(msg, ms = 2600, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toastAct">${esc(action.label)}</button>` : '');
  el.classList.toggle('act', !!action);
  if (action) el.querySelector('#toastAct').addEventListener('click', () => { el.classList.remove('show'); action.fn(); });
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

/* Run an action that can be undone from the toast for a few seconds */
function withUndo(msg, fn) {
  const snap = JSON.stringify({ teams: state.teams, history: state.history });
  fn();
  save(); render();
  toast(msg, 5000, { label: 'Ongedaan maken', fn: () => {
    const s = JSON.parse(snap);
    state.teams = s.teams; state.history = s.history;
    save(); render(); toast('Hersteld', 1500);
  }});
}

/* Two-step button: first tap arms it, second tap confirms */
function confirmButton(btn, armedText, fn) {
  const original = btn.innerHTML;
  let t;
  btn.addEventListener('click', () => {
    if (btn.classList.contains('armed')) { clearTimeout(t); fn(); return; }
    btn.classList.add('armed'); btn.textContent = armedText;
    t = setTimeout(() => { btn.classList.remove('armed'); btn.innerHTML = original; }, 3500);
  });
}

/* ============================================================
   Sheet: edit a team (long press)
   ============================================================ */
function openEdit(i) {
  const t = state.teams[i];
  const swatches = COLORS.map(c =>
    `<button class="sw ${c.toLowerCase() === t.color.toLowerCase() ? 'sel' : ''}" data-c="${c}" style="background:${c}" aria-label="Kleur ${c}"></button>`
  ).join('');

  openSheet(`
    <h2>Team ${i + 1} aanpassen</h2>
    <label class="field"><span>Naam of nummer</span>
      <div class="input-wrap">
        <input id="fName" type="text" maxlength="14" value="${esc(t.name)}" autocomplete="off" autocapitalize="words" enterkeyhint="done">
        <button class="clear" id="fClear" type="button" aria-label="Naam wissen">×</button>
      </div></label>
    <div class="field"><span>Score</span>
      <div class="stepper">
        <button id="fMinus" aria-label="Min één">−</button>
        <input id="fScore" type="number" inputmode="numeric" min="0" max="999" value="${t.score}" enterkeyhint="done">
        <button id="fPlus" aria-label="Plus één">+</button>
      </div></div>
    <div class="field"><span>Kleur</span>
      <div class="swatches">${swatches}
        <label class="sw custom" aria-label="Eigen kleur"><input id="fColor" type="color" value="${t.color}"></label>
      </div></div>
    <button class="primary" id="fDone">Klaar</button>
  `, body => {
    const name = body.querySelector('#fName');
    const score = body.querySelector('#fScore');
    const setScore = v => { t.score = Math.min(999, Math.max(0, parseInt(v, 10) || 0)); save(); render(); };

    // Select the whole name on tap so typing replaces it instead of adding to it
    name.addEventListener('focus', () => setTimeout(() => name.select(), 0));
    name.addEventListener('input', () => { t.name = name.value; save(); render(); });
    body.querySelector('#fClear').addEventListener('click', () => { name.value = ''; t.name = ''; name.focus(); render(); });

    score.addEventListener('focus', () => setTimeout(() => score.select(), 0));
    score.addEventListener('input', () => setScore(score.value));
    body.querySelector('#fMinus').addEventListener('click', () => { setScore(t.score - 1); score.value = t.score; });
    body.querySelector('#fPlus').addEventListener('click', () => { setScore(t.score + 1); score.value = t.score; });
    [name, score].forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') closeSheet(); }));

    const setColor = c => {
      t.color = c; save(); render();
      body.querySelectorAll('.sw[data-c]').forEach(b => b.classList.toggle('sel', b.dataset.c.toLowerCase() === c.toLowerCase()));
    };
    body.querySelectorAll('.sw[data-c]').forEach(b => b.addEventListener('click', () => setColor(b.dataset.c)));
    body.querySelector('#fColor').addEventListener('input', e => setColor(e.target.value));
    body.querySelector('#fDone').addEventListener('click', closeSheet);
  });
}

/* ============================================================
   Sheet: finish game and time-up
   ============================================================ */
function openFinish(timeIsUp) {
  const [a, b] = state.teams;
  const none = a.score === 0 && b.score === 0;
  const winner = a.score > b.score ? label(a, 0) : label(b, 1);
  const verdict = none ? 'Nog geen punten gescoord' : a.score === b.score ? '🤝 Gelijkspel' : `🏆 ${esc(winner)} wint`;

  openSheet(`
    <h2>${timeIsUp ? '⏰ Tijd is om!' : 'Potje afronden'}</h2>
    <div class="final">
      <div class="box" style="background:${a.color};color:${textOn(a.color)}">${a.score}<small>${esc(label(a, 0))}</small></div>
      <div class="box" style="background:${b.color};color:${textOn(b.color)}">${b.score}<small>${esc(label(b, 1))}</small></div>
    </div>
    <div class="verdict">${verdict}</div>
    <button class="primary" id="fSave" ${none ? 'disabled' : ''}>Opslaan &amp; nieuw potje</button>
    <button class="secondary" id="fCancel">${timeIsUp ? 'Doorspelen' : 'Annuleren'}</button>
  `, body => {
    body.querySelector('#fSave').addEventListener('click', saveGame);
    body.querySelector('#fCancel').addEventListener('click', closeSheet);
  });
}
function timeUp() { alarm(); openFinish(true); }

function saveGame() {
  closeSheet();
  withUndo('Potje opgeslagen ✔', () => {
    const [a, b] = state.teams;
    state.history.push({
      t: Date.now(),
      a: { name: label(a, 0), color: a.color, score: a.score },
      b: { name: label(b, 1), color: b.color, score: b.score }
    });
    a.score = 0; b.score = 0;
  });
  resetTimer();
}
$('#btnAdd').addEventListener('click', () => openFinish(false));

/* ============================================================
   Sheet: menu
   ============================================================ */
function openMenu() {
  openSheet(`
    <h2>Menu</h2>
    <div class="field"><span>Speeltijd</span>
      <div class="seg" id="seg">
        ${[6, 8, 10].map(m => `<button data-m="${m}" class="${state.timerMin === m ? 'on' : ''}">${m} min</button>`).join('')}
      </div></div>
    <button class="primary" id="mFinish" style="margin-top:0">✓ Potje afronden</button>
    <div class="row2">
      <button class="secondary" id="mHistory">📊 Uitslagen</button>
      <button class="secondary" id="mSwap">⇅ Wissel kant</button>
    </div>
    <label class="switch-row"><span>Bovenste team omdraaien<small>Handig als je tegenover elkaar zit</small></span>
      <input type="checkbox" id="mFlip" ${state.flipTop ? 'checked' : ''}><i></i></label>
    <label class="switch-row"><span>Geluid<small>Piepjes aan het einde van de tijd</small></span>
      <input type="checkbox" id="mSound" ${state.sound ? 'checked' : ''}><i></i></label>
    <div class="row2">
      <button class="danger" id="mReset">Scores op 0</button>
      <button class="secondary" id="mHelp">ℹ️ Uitleg</button>
    </div>
  `, body => {
    body.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', () => {
      state.timerMin = +b.dataset.m;
      resetTimer();
      body.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
    }));
    body.querySelector('#mFinish').addEventListener('click', () => openFinish(false));
    body.querySelector('#mHistory').addEventListener('click', openHistory);
    body.querySelector('#mHelp').addEventListener('click', openHelp);
    body.querySelector('#mSwap').addEventListener('click', () => {
      state.teams.reverse(); save(); closeSheet(); toast('Teams gewisseld', 1600);
    });
    body.querySelector('#mFlip').addEventListener('change', e => { state.flipTop = e.target.checked; save(); render(); });
    body.querySelector('#mSound').addEventListener('change', e => { state.sound = e.target.checked; save(); if (state.sound) { unlockAudio(); beep(0, .08, 660); } });
    confirmButton(body.querySelector('#mReset'), 'Zeker? Tik nog eens', () => {
      closeSheet();
      withUndo('Scores op 0 gezet', () => state.teams.forEach(t => t.score = 0));
    });
  });
}
$('#btnMenu').addEventListener('click', openMenu);

/* ============================================================
   Sheet: results table and win totals
   ============================================================ */
function standings() {
  const map = new Map();
  const key = s => s.name.trim().toLowerCase();
  for (const g of state.history) {
    for (const side of [g.a, g.b]) {
      if (!map.has(key(side))) map.set(key(side), { name: side.name, color: side.color, wins: 0, played: 0, points: 0 });
      const e = map.get(key(side));
      e.played++; e.points += side.score; e.name = side.name; e.color = side.color;
    }
    if (g.a.score !== g.b.score) map.get(key(g.a.score > g.b.score ? g.a : g.b)).wins++;
  }
  return [...map.values()].sort((x, y) => y.wins - x.wins || y.points - x.points);
}

function when(ts) {
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? time : d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
}

function openHistory() {
  const games = state.history;
  let html = '<h2>Uitslagen</h2>';

  if (!games.length) {
    html += '<div class="empty">Nog geen potjes opgeslagen.<br>Tik op <b>Potje afronden</b> als een potje klaar is.</div>';
  } else {
    const st = standings();
    const leader = st[0].wins > 0 && (!st[1] || st[1].wins < st[0].wins);
    html += '<div class="stand">' + st.map((e, idx) => `
      <div class="row"><span class="dot" style="background:${e.color}"></span>
        <span class="nm">${idx === 0 && leader ? '🏆 ' : ''}${esc(e.name)}<small>${e.played} gespeeld · ${e.points} punten</small></span>
        <span class="wins">${e.wins}<small>gewonnen</small></span></div>`).join('') + '</div>';

    html += `<p class="sub">Alle potjes (${games.length}), nieuwste bovenaan</p><table><tbody>`;
    html += games.map((g, idx) => {
      const aw = g.a.score > g.b.score, bw = g.b.score > g.a.score;
      return `<tr><td class="nr">#${idx + 1}<small>${when(g.t)}</small></td>
        <td class="l ${aw ? 'w' : ''}">${aw ? '🏆 ' : ''}${esc(g.a.name)}</td>
        <td class="sc">${g.a.score} – ${g.b.score}</td>
        <td class="r ${bw ? 'w' : ''}">${esc(g.b.name)}${bw ? ' 🏆' : ''}</td></tr>`;
    }).reverse().join('');
    html += '</tbody></table>';
    html += '<button class="danger" id="hClear" style="margin-top:22px">Alle uitslagen wissen</button>';
  }
  html += '<button class="secondary" id="hBack">← Terug</button>';

  openSheet(html, body => {
    body.querySelector('#hBack').addEventListener('click', openMenu);
    const clear = body.querySelector('#hClear');
    if (clear) confirmButton(clear, 'Zeker? Tik nog eens', () => {
      withUndo('Uitslagen gewist', () => { state.history = []; });
      openHistory();
    });
  });
}

/* ============================================================
   Sheet: help
   ============================================================ */
function openHelp() {
  openSheet(`
    <h2>Uitleg</h2>
    <div class="help">
      <div><span>👆</span><p style="margin:0"><b>Tik</b> op een kleur: punt erbij</p></div>
      <div><span>👇</span><p style="margin:0"><b>Sleep naar beneden</b>: punt eraf</p></div>
      <div><span>✋</span><p style="margin:0"><b>Houd ingedrukt</b>: naam, score en kleur aanpassen</p></div>
      <div><span>⏱️</span><p style="margin:0"><b>Timer</b>: tik op de tijd om te starten of pauzeren, ↺ zet hem terug</p></div>
      <div><span>✓</span><p style="margin:0"><b>Potje afronden</b>: uitslag opslaan en opnieuw beginnen</p></div>
      <div><span>⋯</span><p style="margin:0"><b>Menu</b>: speeltijd, uitslagen, kant wisselen en meer</p></div>
      <div><span>↩︎</span><p style="margin:0">Per ongeluk iets gedaan? Tik op <b>Ongedaan maken</b> in de melding onderin</p></div>
    </div>
    <button class="secondary" id="hlBack" style="margin-top:20px">← Terug</button>
  `, body => body.querySelector('#hlBack').addEventListener('click', openMenu));
}

/* ============================================================
   Start up
   ============================================================ */
render();
tick();   // also fires the alarm if the timer ran out while the page was closed
if (state.timer.running) keepAwake();
if (!state.hintSeen) {
  state.hintSeen = true; save();
  setTimeout(() => toast('Tik = punt erbij · Sleep omlaag = punt eraf · Houd ingedrukt = aanpassen', 7000), 600);
}

/* Register the service worker so the app also works offline */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
